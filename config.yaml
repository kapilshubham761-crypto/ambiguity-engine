model:
  name: qwen2.5:3b-instruct
  endpoint: http://localhost:11434/api/generate
  stream: false

paths:
  src: src/
  data: data/
  logs: logs/
  snapshots: snapshots/
  ui: ui/
  db: data/graph.db

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  dim: 384
  similarity_threshold_merge: 0.85  # merge concepts if closer than this
  similarity_threshold_edge: 0.05   # floor weight for co-occurring concept edges (tune later)

ambiguity:
  low_max: 0.3
  high_min: 0.6
  weights:
    variance: 0.45  # input-concept spread — graph-independent signal
    cluster: 0.45   # bimodality of concept cloud — graph-independent signal
    bridge: 0.10    # graph topology — grows more meaningful as graph fills

modulation:
  medium_neighbors: 5
  high_neighbors: 8

decay:
  daily_factor: 0.99
  prune_weight_below: 0.1
  orphan_days: 14
  reinforce_factor: 1.1

meta_state:
  decay_rate: 0.97          # activation multiplier per minute elapsed
  reinforce_gain: 0.25      # boost added per accepted lesson
  active_threshold: 0.20    # cutoff for "currently active" concept
  max_concepts: 500         # hard cap — drop weakest when exceeded
  # Phase A — Saturation
  gain_mode: sigmoid                # "sigmoid" | "linear"
  fatigue_k: 0.2                    # penalty per repeated hit · 0.0=off
  fatigue_window_minutes: 15        # window for hit counting
  cooling_alpha: 0.5                # hot-concept decay speed-up · 0.0=flat
  # Phase D1 — Normalisation
  normalisation_mode: proportional  # "proportional" | "softmax"
  normalisation_threshold: 0.65     # mean activation trigger

attention:
  bias_strength: 0.0        # meta activation weight · ramp after Pause II
  novelty_strength: 0.0     # novelty pressure weight · start OFF

tension:
  window_size: 50           # ambiguity observations retained per concept
  hot_threshold: 0.60       # mean ambiguity score to count as hot
  hot_min_observations: 5   # ignore one-off spikes below this count

novelty:
  enabled: true
  persist_path: data/novelty.json

homework:
  curiosity_pull_prob: 0.20  # fraction of slots → curiosity selection

anti_loop:
  loop_window: 20            # top-5 snapshots to scan
  loop_min_repeats: 5        # repeated set hits to trigger
  overlap_threshold: 0.80    # Jaccard similarity for "same set"
  escape_concepts: 3         # concepts injected on detection

regions:
  suppression_factor: 0.90   # non-active region decay multiplier
  bridge_threshold: 0.30     # bridge_score to exempt from suppression
  bridge_strength: 0.0       # attention boost for bridge nodes · start OFF
  latent_recall_prob: 0.02   # chance per tick to revive dormant region
  min_revival_activation: 0.15
  region_switch_threshold: 0.70  # entropy threshold for region exhaustion
  min_graph_size: 200            # skip partitioning below this node count

stability:
  entropy_window: 10         # ticks for rolling entropy average
  entropy_min: 0.20          # below = fixation alert
  entropy_max: 0.80          # above = noise/distraction alert

cognitive_mode:
  enabled: true
  mode_weights:
    focused:      {decay: 0.90, suppression: 1.10, novelty: 0.80}
    exploratory:  {decay: 1.05, novelty: 1.40, curiosity: 1.50}
    associative:  {bridge: 1.80, suppression: 0.70}
    exploitative: {bias: 1.40, novelty: 0.60, decay: 0.95}
    reflective:   {decay: 0.80, tension: 1.30}

# ── V3 — Deep Memory & Reasoning ──────────────────────────────────────────

temporal_memory:
  working:
    decay_rate: 0.97          # per minute — same plane as meta_state
    gain: 0.40
    promote_threshold: 0.35   # working value to trigger episodic write
  episodic:
    decay_rate: 0.9997        # ~0.78 after 4h (240 min)
    gain: 0.10
    promote_count: 3          # episodic hits before semantic consolidation
    promote_threshold: 0.15
  semantic:
    decay_rate: 0.99997       # ~0.87 after 24h (1440 min)
    gain: 0.03

episodes:
  max_episodes: 1000          # rolling JSONL window
  min_concepts: 2             # skip single-concept episodes
  transition_decay: 0.95      # per-use weight decay on transition edges

predictor:
  top_k: 5                    # predictions to pre-activate
  pre_activation_gain: 0.08   # gain applied to pre-activated concepts
  min_transition_weight: 0.05 # ignore weak transitions

contradiction:
  detection_cosine_min: 0.30  # min cosine distance between conflicting concepts
  tension_min: 0.40           # concept must be hot to register contradiction
  max_contradictions: 50      # rolling cap (oldest dropped first)

simulator:
  max_steps: 5
  branch_factor: 3            # top predictions per propagation step

reflection:
  tick_every: 5               # background ticks between reflection snapshots

abstractor:
  min_cooccurrence: 5         # times pair must co-occur to form abstract link
  min_cluster_size: 3         # minimum members for an abstract concept
  emergence_threshold: 0.60   # co-occurrence density to trigger compression

goals:
  drives:
    reduce_uncertainty:    0.30
    increase_novelty:      0.25
    resolve_contradiction: 0.20
    maintain_stability:    0.15
    expand_regions:        0.10
  update_every: 10            # background ticks between goal updates
